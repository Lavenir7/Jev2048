<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Jev · 2048</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="/logo.svg" alt="Jev 2048" width="48" height="48" />
          <span class="brand-sub">Jev 2048</span>
        </div>

        <div class="top-center">
          <div class="mode-switch">
            <div class="segmented" id="mode-switch">
              <button class="seg-btn" data-mode="sync" type="button">同步</button>
              <button class="seg-btn" data-mode="race" type="button">竞速</button>
            </div>
          </div>
          <p class="mode-hint" id="mode-hint"></p>
        </div>

        <div class="top-actions">
          <span id="jev-cost" class="bubble cost-bubble" title="本次会话的 Jev 花费（只计输入 token）">COST $0.0000</span>
          <span id="jev-status" class="status status-wait">检测中…</span>
          <button id="primary-action" class="btn icon-btn" type="button" title="Jev 走一步" aria-label="Jev 走一步">
            <svg class="solid icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5.5 2.6 21.5 12 5.5 21.4Z" />
            </svg>
            <svg class="solid icon-stop" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="4" y="4" width="16" height="16" rx="3.5" />
            </svg>
          </button>
          <button id="reset-all" class="btn icon-btn" type="button" title="全部重开" aria-label="全部重开">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
          </button>
        </div>
      </header>

      <div class="arena" id="arena"></div>
    </div>

    <template id="side-template">
      <section class="side">
        <!-- Outer-left panel: Jev config (shown when this side is played by Jev) -->
        <aside class="side-panel side-config" hidden>
          <p class="panel-title">Jev 配置</p>
          <label class="field">
            <span>模型</span>
            <select class="model-select"></select>
          </label>
          <label class="field">
            <span>决策权重：直觉 <b class="weight-value">60%</b> · 评估 <b class="weight-rest">40%</b></span>
            <input class="weight" type="range" min="0" max="100" step="5" value="60" />
          </label>
          <label class="field race-only">
            <span>出手间隔：<b class="delay-value">800 ms</b></span>
            <input class="delay" type="range" min="0" max="3000" step="100" value="800" />
          </label>
          <label class="field race-only">
            <span>步数上限 (0 → ∞)</span>
            <input class="limit" type="number" min="0" max="9999" step="1" value="200" />
          </label>
        </aside>

        <!-- The game screen -->
        <div class="side-main">
          <div class="side-head">
            <div class="side-title">
              <span class="lead-badge">领先</span>
              <span class="side-status status status-wait">—</span>
            </div>
            <span class="best-bubble">最高 <b class="best">0</b></span>
            <span class="cost-pill"><b class="side-cost">$&lt;0.0001</b></span>
            <div class="side-controls">
              <button class="jev-step btn icon-btn" type="button" title="Jev 走一步" aria-label="Jev 走一步">
                <svg class="solid" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M5.5 2.6 21.5 12 5.5 21.4Z" />
                </svg>
              </button>
              <button class="new-game btn icon-btn" type="button" title="重开" aria-label="重开">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <polyline points="23 4 23 10 17 10" />
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
              </button>
              <div class="segmented" role="group" aria-label="控制方式">
                <button class="seg-btn" data-controller="human" type="button">玩家</button>
                <button class="seg-btn" data-controller="jev" type="button">Jev</button>
              </div>
            </div>
          </div>

          <div class="side-scores">
            <div class="score-box"><span>得分</span><strong class="score">0</strong></div>
            <div class="score-box"><span>步数</span><strong class="steps">0</strong></div>
          </div>

          <div class="board-wrap">
            <div class="board" aria-label="2048 棋盘"></div>
            <div class="overlay hidden">
              <h2 class="overlay-title"></h2>
              <p class="overlay-text"></p>
              <button class="overlay-btn btn primary" type="button">重开</button>
            </div>
          </div>

          <div class="dpad">
            <button class="btn dpad-btn" data-move="up" type="button" aria-label="上">↑</button>
            <div class="dpad-row">
              <button class="btn dpad-btn" data-move="left" type="button" aria-label="左">←</button>
              <button class="btn dpad-btn" data-move="down" type="button" aria-label="下">↓</button>
              <button class="btn dpad-btn" data-move="right" type="button" aria-label="右">→</button>
            </div>
          </div>

          <div class="log"></div>
        </div>

        <!-- Outer-right panel: manual input methods (shown when a human plays this side) -->
        <aside class="side-panel side-help" hidden>
          <p class="panel-title">控制方式</p>
          <div class="input-list">
            <label class="input-item">
              <input type="checkbox" data-input="arrows" />
              <span class="input-name"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span>
            </label>
            <label class="input-item">
              <input type="checkbox" data-input="wasd" />
              <span class="input-name"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
            </label>
            <label class="input-item">
              <input type="checkbox" data-input="swipe" />
              <span class="input-name">滑动（触摸）</span>
            </label>
            <label class="input-item">
              <input type="checkbox" data-input="buttons" />
              <span class="input-name">界面按键</span>
            </label>
          </div>
        </aside>
      </section>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
